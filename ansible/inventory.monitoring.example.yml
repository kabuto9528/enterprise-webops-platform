# Example only: store real values and keys under .local/ or an ignored inventory.local.yml.
all:
  children:
    web:
      hosts:
        web01-hz: {}
    metrics_nodes:
      hosts:
        web01-hz:
          ansible_host: web01.example.invalid
          ansible_user: authorized-admin
          node_exporter_listen: 127.0.0.1:9100
        ops01:
          ansible_host: ops01.example.invalid
          ansible_user: ops
          node_exporter_listen: REPLACE_WITH_OPS_LOCAL_ADDRESS:9100
          monitor01_source_ipv4: REPLACE_WITH_MONITOR_LOCAL_ADDRESS
          # Enable only after exact source filtering and a fresh SSH rescue check.
          node_exporter_ops_firewall_reviewed: false
        monitor01:
          ansible_host: monitor01.example.invalid
          ansible_user: monitor
          node_exporter_listen: 127.0.0.1:9100
      vars:
        webops_monitoring_admin_confirm: true
        ansible_ssh_common_args: -o StrictHostKeyChecking=yes -o IdentitiesOnly=yes -o ForwardAgent=no
