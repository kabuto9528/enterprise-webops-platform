---
- name: Require the stage04 Docker version
  ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
  register: project_docker
  changed_when: false
  failed_when: project_docker.stdout != '29.9.2'

- name: Require the stage04 Compose version
  ansible.builtin.command: docker compose version --short
  register: project_compose
  changed_when: false
  failed_when: project_compose.stdout not in ['5.6.1', 'v5.6.1']

- name: Keep the already accepted Docker service running
  ansible.builtin.systemd_service:
    name: docker
    state: started
    enabled: true
