---
- name: Install the reviewed root-owned release engine
  ansible.builtin.copy:
    src: '{{ playbook_dir }}/../scripts/webops-release.py'
    dest: /usr/local/sbin/webops-release
    owner: root
    group: root
    mode: '0750'
    validate: /usr/bin/python3 -c "import ast; ast.parse(open('%s').read())"
