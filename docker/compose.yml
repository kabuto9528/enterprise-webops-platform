name: webops

services:
  app:
    platform: linux/amd64
    image: webops-app:${WEBOPS_VERSION:?Set WEBOPS_VERSION to the full source Git SHA}
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        PYTHON_BASE: ${PYTHON_BASE:?Set an official Python 3.12 image with its sha256 digest}
        WEBOPS_VERSION: ${WEBOPS_VERSION:?Set WEBOPS_VERSION to the full source Git SHA}
    environment:
      WEBOPS_VERSION: ${WEBOPS_VERSION:?Set WEBOPS_VERSION to the full source Git SHA}
    ports:
      - "127.0.0.1:18080:8000"
    restart: unless-stopped
    stop_grace_period: 20s
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - app

networks:
  app:
    name: webops-app
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-webops
